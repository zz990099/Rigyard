version: 1

containers:
  development:
    description: Interactive robot development container
    name:
      default: robot-development
      prompt: {mode: input, message: Enter the container name}
    image:
      default: ubuntu:24.04
      prompt:
        mode: select
        message: Select the container image
        options: [ubuntu:22.04, ubuntu:24.04]
    privileged:
      default: false
      prompt: {mode: confirm, message: "Enable privileged mode?"}
    devices: [/dev/dri]
    group_add: [video]
    network: host
    ipc: host
    mounts:
      default:
        - /tmp/.X11-unix:/tmp/.X11-unix
        - ../:/workspace
        - /dev/bus/usb:/dev/bus/usb
      prompt:
        mode: input
        repeat: true
        message: Enter a mount
        item_hint: SOURCE:TARGET[:ro]
    workdir: /workspace
    environment:
      DISPLAY: {env: DISPLAY}
      DOCKER_USER: {env: USER}
      USER: {env: USER}
    command: [/bin/bash]
