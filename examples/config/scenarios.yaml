robot-system:
  description: Example multi-process robot system
  instances:
    robot:
      description: Robot software stack running in the development container
      container: robot-development
      groups:
        drivers:
          script: /workspace/scripts/scenarios/drivers.sh
          setup: [/opt/ros/humble/setup.bash, install/setup.bash]
          interpreter: [/bin/bash, -euo, pipefail]
          workdir: /workspace
          environment:
            ROS_DOMAIN_ID:
              default: "7"
              prompt:
                mode: input
                message: Enter the ROS domain ID

        navigation:
          script: /workspace/scripts/scenarios/navigation.sh
          interpreter: [/bin/bash, -euo, pipefail]
          workdir: /workspace

        application:
          script: /workspace/scripts/scenarios/application.sh
          interpreter: [/bin/bash, -euo, pipefail]
          workdir: /workspace

    # A second instance runs a second software stack in another container:
    # one more tmux window in another existing container.
    # simulator:
    #   container: robot-simulator
    #   groups:
    #     sim:
    #       setup: [install/setup.bash]
    #       command: [ros2, launch, nhybot_bringup, sim.launch.py]
    #       workdir: /workspace

  profiles:
    development:
      restart_container: always
      attach: true
      stop_grace_seconds: 5

# The same tmux workflow can let Docker Compose prepare the containers first.
# Here `container` is the Compose service name rather than an existing container name.
robot-system-compose:
  description: Example robot system whose development container is managed by Compose
  compose:
    file: deploy/compose.development.yaml
    project_name: robot-system-debug
    wait_timeout_seconds: 60
  instances:
    robot:
      container: robot
      groups:
        drivers:
          script: /workspace/scripts/scenarios/drivers.sh
          setup: [/opt/ros/humble/setup.bash, install/setup.bash]
          interpreter: [/bin/bash, -euo, pipefail]
          workdir: /workspace
  profiles:
    development:
      attach: true
      stop_grace_seconds: 5
