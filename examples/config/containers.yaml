description: Example containers

development:
  description: Interactive robot development container
  name:
    default: robot-development
    prompt:
      mode: input
      message: Enter the container name
  image: example/robot-development:latest
  privileged:
    default: false
    prompt:
      mode: confirm
      message: Enable privileged mode?
  devices: [/dev/dri]
  group_add: [video]
  network: host
  ipc: host
  mounts:
    default:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ../:/workspace
      - /dev/bus/usb:/dev/bus/usb
    prompt:
      mode: input
      repeat: true
      message: Enter a mount
      item_hint: SOURCE:TARGET[:ro]
  workdir: /workspace
  environment:
    DISPLAY: {env: DISPLAY}
    DOCKER_USER: {env: USER}
    USER: {env: USER}
  command: [/bin/bash]

cross-aarch64:
  description: AArch64 cross-compilation environment
  name: robot-cross-aarch64
  image: example/cross-aarch64-base:latest
  mounts:
    - .:/workspace
    - /opt/robot/sysroot-aarch64:/opt/sysroot
  workdir: /workspace
  lifecycle:
    post_create:
      - name: prepare-sysroot
        script: scripts/cross/prepare-sysroot.sh
        interpreter: [/bin/bash, -eu]
        user: root
        workdir: /workspace
        environment:
          SYSROOT: /opt/sysroot
        timeout_seconds: 300
    post_start:
      - name: verify-toolchain
        script: scripts/cross/verify-toolchain.sh
        interpreter: [/bin/bash, -eu]
        workdir: /workspace
        environment:
          SYSROOT: /opt/sysroot
        timeout_seconds: 30
  command: [/bin/bash]
