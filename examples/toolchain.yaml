version: 1

parameters:
  target:
    type: choice
    description: 运行目标
    options: [simulation, hardware]
    default: simulation

  debug:
    type: bool
    default: false

  vehicle_count:
    type: int
    default: 1
    min: 1
    max: 20

  serial_device:
    type: path
    enabled_if:
      target: hardware
    required: true

  labels:
    type: list
    item_type: string
    default: [robot, development]

images:
  development:
    base: ubuntu:22.04
    context: .
    tag: example/robot-development:latest
    build_args:
      VEHICLE_COUNT:
        parameter: vehicle_count
    layers:
      - name: system
        dockerfile: docker/layers/10-system.Dockerfile
      - name: application
        dockerfile: docker/layers/20-application.Dockerfile

