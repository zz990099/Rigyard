version: 3

metadata:
  name: robot-development
  description: Minimal ROS Jazzy and Nav2 development example

workspace:
  command_alias: robot

variables:
  PROJECT_ROOT: ${RIGYARD_ROOT}
  CONTAINER_WORKSPACE_ROOT: /workspace

branding:
  logo_file: ${RIGYARD_ROOT}/logo.txt

sources:
  images:
    - images/image.yaml
  containers:
    - containers/containers.yaml
  builds:
    - builds/build.yaml
  scenarios:
    - scenarios/nav2-tb3.yaml
