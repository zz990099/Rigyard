version: 3

metadata:
  name: robot-development
  description: Example Rigyard project for robot development

variables:
  PROJECT_ROOT: ${RIGYARD_ROOT}
  CONTAINER_WORKSPACE_ROOT: /workspace

sources:
  images:
    - config/images.yaml
  containers:
    - config/containers.yaml
  builds:
    - config/builds.yaml
  tests:
    - config/tests.yaml
  scenarios:
    - config/scenarios.yaml
