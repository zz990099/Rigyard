name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: pytest --cov=rigyard --cov-report=term-missing --cov-fail-under=90
      - run: ruff check . && ruff format --check .
      - if: matrix.python-version == '3.12'
        run: mypy src/rigyard && pyright src/rigyard

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Ensure this Release comes from main
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Verify distribution contents and Release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python scripts/verify_distributions.py dist --tag "$RELEASE_TAG"
      - name: Install and validate the release wheel
        run: |
          python -m venv "$RUNNER_TEMP/rigyard-release"
          "$RUNNER_TEMP/rigyard-release/bin/python" -m pip install dist/*.whl
          (
            cd "$RUNNER_TEMP"
            "$RUNNER_TEMP/rigyard-release/bin/rigyard" --version
            "$RUNNER_TEMP/rigyard-release/bin/rigyard" \
              --config "$GITHUB_WORKSPACE/examples/minimal/rigyard.yaml" validate
          )
      - uses: actions/upload-artifact@v5
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  docker-smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v6
        with:
          name: python-distributions
          path: dist/
      - run: python -m pip install dist/*.whl
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: docker info && docker compose version && tmux -V
      - run: bash tests/integration/smoke.sh

  publish:
    needs: docker-smoke
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/rigyard/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
